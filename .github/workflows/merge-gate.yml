name: merge gate

# pull_request_target runs this file and the checker from the base branch, so a
# pull request can't rewrite the check that judges it. It never checks out or
# runs the pull request's code; the description only reaches it through env.
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  verdicts:
    name: verdicts (verify-this, review)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/check-pr-body.mts
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The body goes through env, never into the script text, so it cannot inject shell.
      - run: node scripts/check-pr-body.mts
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
